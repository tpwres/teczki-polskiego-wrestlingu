on:
  pull_request:
    types: [opened, synchronize]

name: New linter pipeline
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - name: Install mise and dependencies
        uses: jdx/mise-action@v4
        with:
          bootstrap: true
      - name: Run guardians
        id: analysis
        run: |
          uv run make meta aliases
          uv run bin/guardian
      - name: Post review comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_PATH: ${{ github.repository }}
          REPORT_FILE: ${{ steps.analysis.outputs.report_file }}
        run: |
          PYTHONPATH=src uv run python src/bin/post_review.py
