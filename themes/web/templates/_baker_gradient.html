<svg aria-hidden="true" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; z-index: -1;">
    <defs>
        <!-- 
            userSpaceOnUse maps coordinates to the Lucide 24x24 viewBox.
            24 units * 4x scale = 96 units wide.
        -->
        <linearGradient id="rainbow-stroke-baker" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="96" y2="0" spreadMethod="repeat">
        <stop offset="0%" stop-color="#ff69b4" />
        <stop offset="12.5%" stop-color="#ff69b4" />

        <stop offset="12.5%" stop-color="#ff0000" />
        <stop offset="25%" stop-color="#ff0000" />

        <stop offset="25%" stop-color="#ff8e00" />
        <stop offset="37.5%" stop-color="#ff8e00" />

        <stop offset="37.5%" stop-color="#ffff00" />
        <stop offset="50%" stop-color="#ffff00" />

        <stop offset="50%" stop-color="#008e00" />
        <stop offset="62.5%" stop-color="#008e00" />

        <stop offset="62.5%" stop-color="#00c0c0" />
        <stop offset="75%" stop-color="#00c0c0" />

        <stop offset="75%" stop-color="#400090" />
        <stop offset="87.5%" stop-color="#400090" />

        <stop offset="87.5%" stop-color="#8e008e" />
        <stop offset="100%" stop-color="#8e008e" />

        <!-- Shift 96 units left to match the CSS animation distance -->
        <animate attributeName="x1" values="0;-96" dur="6s" repeatCount="indefinite" />
        <animate attributeName="x2" values="96;0" dur="6s" repeatCount="indefinite" />
        </linearGradient>
    </defs>
</svg>
